<!-- ==================================================================
     THE WEEKLY WRAP-UP
     Paste into ONE Custom Code / HTML element on a GoHighLevel page
     at /weekly-wrap-up. Self-contained: fonts and styles are included.

     The card is a visual match for the site's existing popup — same
     #faf5f0, 10px radius, 520px cap, padding, shadow, eyebrow, DM Serif
     title and fine print — and embeds the same live form, so signups
     land in the same place. No close button: nothing to close on a page.
     ================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
.ww-stage,.ww-stage *,.ww-stage *::before,.ww-stage *::after{box-sizing:border-box;}
.ww-stage{
  background:#2e211c;
  padding:clamp(48px,8vw,96px) 20px;
  display:flex;align-items:center;justify-content:center;
  /* Full-bleed: GoHighLevel rows are a centred, max-width container, which
     would otherwise leave pale gutters either side of the dark ground.
     Delete these four lines to sit inside the row instead. */
  width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
  overflow-x:clip;}
.ww-card{
  position:relative;width:100%;max-width:520px;
  background:#faf5f0;border-radius:10px;padding:clamp(28px,4vw,42px);color:#222;
  box-shadow:0 30px 80px -20px rgba(46,33,28,.6);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  line-height:1.65;}
.ww-card p{margin:0;}
.ww-eyebrow{
  font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:#7a5540;display:block;margin-bottom:12px;}
.ww-title{
  font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;
  font-size:1.8rem;line-height:1.12;margin:0 0 12px;color:#222;}
.ww-sub{color:#5f544c;font-size:.98rem;line-height:1.6;}
.ww-form{margin-top:22px;}
.ww-form iframe{width:100%;border:0;display:block;min-height:340px;transition:height .2s ease;}
.ww-fine{margin-top:14px;font-size:.78rem;line-height:1.5;color:#6e5a4c;text-align:center;opacity:.9;}
</style>

<section class="ww-stage" id="top">
  <div class="ww-card">
    <span class="ww-eyebrow">The Weekly Wrap-Up</span>
    <h1 class="ww-title">One letter. Every week.</h1>
    <p class="ww-sub">Add your name and email &mdash; it starts this week.</p>

    <div class="ww-form">
      <!-- The live form (id wDko2EkmGCWPQJcqvku9) — the same one the popup
           uses, so submissions land in exactly the same place. -->
      <iframe
          src="https://links.assatathomas.com/widget/form/wDko2EkmGCWPQJcqvku9"
          id="page-wDko2EkmGCWPQJcqvku9"
          title="The Weekly Wrap-Up"
          data-layout="{'id':'INLINE'}"
          data-trigger-type="alwaysShow"
          data-activation-type="alwaysActivated"
          data-deactivation-type="neverDeactivate"
          data-form-name="The Weekly Wrap-Up"
          data-layout-iframe-id="page-wDko2EkmGCWPQJcqvku9"
          data-form-id="wDko2EkmGCWPQJcqvku9"
          data-cookie-consent="true"
          data-cookie-consent-provider="auto"
          style="width:100%;border:none;display:block"></iframe>
    </div>

    <p class="ww-fine">Your details stay private. Unsubscribe any time.</p>
  </div>
</section>

<!-- Sizes the embedded form iframe to its content. Required. -->
<script src="https://links.assatathomas.com/js/form_embed.js"></script>
